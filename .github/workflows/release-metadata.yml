name: Version and changelog
on:
  pull_request:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version copies agree and CHANGELOG.md is well formed
        run: python3 scripts/release.py check
      - name: A release tag matches the version it ships
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(python3 scripts/release.py current)" = "${GITHUB_REF_NAME}"
      - name: Code changes come with a changelog entry
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          if printf '%s\n' "$changed" | grep -qE '^(src/|resources/|packaging/|third_party/|CMakeLists.txt)'; then
            if ! printf '%s\n' "$changed" | grep -qx 'CHANGELOG.md'; then
              echo "::error::Add a user-facing entry under [Unreleased] in CHANGELOG.md, or label the PR skip-changelog."
              exit 1
            fi
          fi
